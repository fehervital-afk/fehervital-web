name: Fehervital AI Marketing Manager

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * *"

permissions:
  contents: read

jobs:
  marketing-manager:
    if: ${{ vars.AI_MARKETING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run marketing analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          python scripts/marketing_manager.py --analyze

      - name: Verify no publication occurs
        run: git status --short
