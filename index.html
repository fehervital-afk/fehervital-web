<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <title>Fehérvitál Egészségpont | Weboldal fejlesztés alatt</title>
  <meta name="description" content="A Fehérvitál Egészségpont weboldala jelenleg fejlesztés alatt áll.">
  <style>
    :root {
      color-scheme: light;
      --green: #16765b;
      --green-dark: #0d4f3e;
      --green-soft: #eaf5f1;
      --ink: #18332b;
      --muted: #5d716a;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(22,118,91,.14), transparent 34rem),
        radial-gradient(circle at 85% 85%, rgba(22,118,91,.10), transparent 30rem),
        linear-gradient(145deg, #f8fcfa, #edf7f3);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(720px, 100%);
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(22,118,91,.16);
      border-radius: 28px;
      box-shadow: 0 28px 80px rgba(13,79,62,.14);
      padding: clamp(30px, 7vw, 64px);
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .mark {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      background: var(--green-soft);
      border: 1px solid rgba(22,118,91,.20);
      color: var(--green);
      font-size: 34px;
      font-weight: 700;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--green-dark);
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.05;
      letter-spacing: -.04em;
    }
    .lead {
      max-width: 560px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 2.7vw, 21px);
      line-height: 1.65;
    }
    .divider {
      width: 64px;
      height: 3px;
      margin: 30px auto;
      border-radius: 999px;
      background: var(--green);
    }
    .contact {
      margin: 0;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.8;
    }
    .contact a {
      color: var(--green-dark);
      font-weight: 700;
      text-decoration: none;
    }
    .contact a:hover { text-decoration: underline; }
    .note {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="mark" aria-hidden="true">F</div>
    <p class="eyebrow">Fehérvitál Egészségpont</p>
    <h1>Weboldalunk megújul</h1>
    <p class="lead">Jelenleg fejlesztjük új weboldalunkat, hogy hamarosan egy modernebb, gyorsabb és átláthatóbb felülettel várhassuk.</p>
    <div class="divider" aria-hidden="true"></div>
    <p class="contact">
      Kapcsolat: <a href="mailto:fehervital@fehervital.com">fehervital@fehervital.com</a><br>
      Telefon: <a href="tel:+36303353536">+36 30 335 3536</a>
    </p>
    <p class="note">Köszönjük a türelmet és a megértést.</p>
  </main>
</body>
</html>
